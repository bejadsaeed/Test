name: ya-telha2 CI (Gradle debug build)
on:
  push: { branches: [main], paths: ["ya-telha2/**", ".github/workflows/ya-telha2-ci.yml"] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ya-telha2 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build web bundle
        run: |
          python3 build.py
          cp dist/single/index.html android/app/src/main/assets/index.html
      - name: Gradle assembleDebug (official Android toolchain)
        working-directory: ya-telha2/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: yatelha2-debug-apk, path: ya-telha2/android/app/build/outputs/apk/debug/app-debug.apk }
